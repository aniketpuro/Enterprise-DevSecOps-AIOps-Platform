apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: boutique
spec:
  # This selects ALL pods in the 'boutique' namespace
  podSelector: {}
  # By specifying both Ingress and Egress, we block EVERYTHING by default
  policyTypes:
  - Ingress
  - Egress
