---
# Allow Frontend to talk to Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-gateway
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 3001

---
# Allow Gateway to talk to backend services (Auth, Products, Orders, Users)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backends
  namespace: boutique
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth, products, orders, users]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway
    # Ports will be evaluated per destination pod based on targetPort in their Services

---
# Allow backend services to access PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-to-postgres
  namespace: boutique
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
          - key: app
            operator: In
            values: [auth, products, orders, users, order-management]
    ports:
    - protocol: TCP
      port: 5432

---
# Allow Orders to talk to Auth and Products (Inter-service communication)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orders-to-auth-products
  namespace: boutique
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth, products]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: orders

---
# Allow Prometheus (in monitoring namespace) to scrape all pods in boutique namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: boutique
spec:
  podSelector: {} # All pods in boutique
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring # Requires monitoring namespace to have this label
      podSelector:
        matchLabels:
          app: prometheus
