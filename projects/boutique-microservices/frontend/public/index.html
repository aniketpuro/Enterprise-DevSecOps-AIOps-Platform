<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#d4af37" />

    <!-- Primary SEO -->
    <title>LuxeBoutique — Premium Luxury Fashion &amp; Designer Clothing</title>
    <meta name="description" content="Shop premium luxury fashion at LuxeBoutique. Discover designer dresses, handbags, shoes, jewelry &amp; accessories. Free shipping on orders over $500." />
    <meta name="keywords" content="luxury fashion, designer clothing, luxury dresses, designer handbags, luxury shoes, jewelry, accessories, boutique fashion, high-end fashion, premium clothing, designer wear, luxury brand, couture, evening gowns, silk dresses, leather bags" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="LuxeBoutique" />
    <link rel="canonical" href="https://www.luxeboutique.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.luxeboutique.com/" />
    <meta property="og:title" content="LuxeBoutique — Premium Luxury Fashion &amp; Designer Clothing" />
    <meta property="og:description" content="Shop premium luxury fashion at LuxeBoutique. Discover designer dresses, handbags, shoes, jewelry &amp; accessories. Free shipping on orders over $500." />
    <meta property="og:image" content="https://www.luxeboutique.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LuxeBoutique — Premium Luxury Fashion" />
    <meta property="og:site_name" content="LuxeBoutique" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LuxeBoutique" />
    <meta name="twitter:creator" content="@LuxeBoutique" />
    <meta name="twitter:title" content="LuxeBoutique — Premium Luxury Fashion &amp; Designer Clothing" />
    <meta name="twitter:description" content="Shop premium luxury fashion at LuxeBoutique. Discover designer dresses, handbags, shoes, jewelry &amp; accessories. Free shipping on orders over $500." />
    <meta name="twitter:image" content="https://www.luxeboutique.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="LuxeBoutique — Premium Luxury Fashion" />

    <!-- PWA / App -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD: Organization Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LuxeBoutique",
      "url": "https://www.luxeboutique.com",
      "logo": "https://www.luxeboutique.com/logo.png",
      "description": "Premium luxury fashion boutique offering designer dresses, handbags, shoes, jewelry and accessories.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "hello@luxeboutique.com",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://www.instagram.com/luxeboutique",
        "https://www.facebook.com/luxeboutique",
        "https://www.twitter.com/luxeboutique",
        "https://www.pinterest.com/luxeboutique"
      ]
    }
    </script>

    <!-- JSON-LD: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LuxeBoutique",
      "url": "https://www.luxeboutique.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.luxeboutique.com/products?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
