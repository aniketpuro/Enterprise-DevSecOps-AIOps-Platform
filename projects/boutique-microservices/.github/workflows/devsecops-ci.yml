name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-scan:
    name: Code Scan (SonarQube)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SonarQube Scan
        # In a real setup, you would use SonarSource/sonarqube-scan-action
        # For open-source, you can run a local sonar-scanner container
        run: echo "Running SonarQube Scanner for code bugs and vulnerabilities..."

  image-scan:
    name: Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: code-scan
    steps:
      - uses: actions/checkout@v4
      - name: Build an image from Dockerfile
        run: docker build -t boutique-gateway:${{ github.sha }} ./backend/services/gateway
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'boutique-gateway:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  k8s-manifest-scan:
    name: K8s Manifest Scan (Kube-Linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan YAML with Kube-linter
        uses: stackrox/kube-linter-action@v1.0.4
        with:
          directory: k8s/
